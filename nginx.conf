worker_processes 1;
pid /tmp/nginx-lab.pid;

error_log /home/qbd/_projects/nginx-systemd-lab/logs/error.log;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    access_log /home/qbd/_projects/nginx-systemd-lab/logs/access.log;

    server {
        listen 8080;
        root /home/qbd/_projects/nginx-systemd-lab/html;
        index index.html;
    }
}
